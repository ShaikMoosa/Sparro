name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # npm on Windows sometimes omits optional deps from the lock file; fall back rather than fail.
      - run: npm ci || npm install --no-audit --no-fund
        shell: bash
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sparro ${{ github.ref_name }}
          releaseBody: |
            Download **Sparro_*_x64_en-US.msi** below and run it.

            The installer isn't code-signed yet: if Windows SmartScreen appears, choose **More info → Run anyway**.
          releaseDraft: false
          prerelease: false
